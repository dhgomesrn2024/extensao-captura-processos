<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Migrador PJe</title>
    <style>
      body {
        width: 340px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #1d2939;
        padding: 12px;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      section { margin-bottom: 12px; }
      label { display: block; margin-bottom: 6px; }
      .oab-row { display: flex; gap: 8px; }
      .oab-row label { flex: 1; }
      input { width: 100%; box-sizing: border-box; padding: 4px 6px; margin-top: 2px; }
      .hint { color: #667085; font-size: 11px; margin: 4px 0 0; }
      button { width: 100%; padding: 8px; margin-top: 6px; cursor: pointer; }
      #migrar { background: #027a48; color: #fff; border: none; border-radius: 6px; font-weight: bold; }
      #migrar:disabled { background: #98a2b3; cursor: default; }
      #status { min-height: 16px; font-size: 12px; color: #344054; }
      .barra { height: 6px; background: #eaecf0; border-radius: 3px; overflow: hidden; margin-top: 6px; }
      .barra > div { height: 100%; width: 0; background: #027a48; transition: width .2s; }
      .secondary-buttons { display: flex; gap: 8px; }
      .secondary-buttons button { background: #f2f4f7; border: 1px solid #d0d5dd; border-radius: 6px; }
      .aviso { color: #b54708; font-size: 11px; }
      hr { border: none; border-top: 1px solid #eaecf0; margin: 12px 0; }
    </style>
  </head>
  <body>
    <h1>Migrador de acervo PJe</h1>

    <section>
      <div class="oab-row">
        <label>
          OAB (número)
          <input id="oabNumero" type="text" inputmode="numeric" placeholder="99999" />
        </label>
        <label>
          UF
          <input id="oabUf" type="text" maxlength="2" placeholder="RN" />
        </label>
      </div>
      <p class="hint">Marca quais partes são suas clientes, comparando com o advogado de cada polo.</p>
    </section>

    <button id="migrar">Migrar acervo completo</button>
    <div class="barra"><div id="progresso"></div></div>
    <p id="status"></p>
    <p id="avisos" class="aviso"></p>

    <hr />

    <section>
      <p><strong id="contador">0</strong> processo(s) na base local</p>
      <p id="revisar" class="aviso"></p>
      <div class="secondary-buttons">
        <button id="baixar">Baixar JSON</button>
        <button id="limpar">Limpar base</button>
      </div>
    </section>

    <section>
      <p class="hint">Se algo falhar, baixe o log e envie.</p>
      <div class="secondary-buttons">
        <button id="baixarLog">Baixar log</button>
        <button id="limparLog">Limpar log</button>
      </div>
    </section>

    <p id="versao" class="hint"></p>

    <script src="logger.js"></script>
    <script src="pje-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
